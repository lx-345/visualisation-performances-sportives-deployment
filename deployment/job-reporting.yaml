apiVersion: batch/v1
kind: CronJob
metadata:
  name: medas-reporting-pipeline
spec:
  schedule: "0 2 * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: reporting
              image: lpanier/visualisation-performances-sportives:latest
              imagePullPolicy: Always
              command: ["sh", "-c", "uv run python -m visualisation_performances_sportives.analyse_sportive.reporting"]
              env:
                - name: AWS_S3_ENDPOINT
                  value: "https://minio.lab.sspcloud.fr"
                - name: S3_BUCKET
                  value: "paleo"
                - name: AWS_ACCESS_KEY_ID
                  valueFrom:
                    secretKeyRef:
                      name: minio-credentials
                      key: access-key
                - name: AWS_SECRET_ACCESS_KEY
                  valueFrom:
                    secretKeyRef:
                      name: minio-credentials
                      key: secret-key
                - name: AWS_SESSION_TOKEN
                  valueFrom:
                    secretKeyRef:
                      name: minio-credentials
                      key: session-token